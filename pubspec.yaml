name: ar_project
description: "Zanfu web ordering site."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  model_viewer_plus: ^1.6.0
  vector_math: ^2.1.4
  http: ^1.2.0
  firebase_core: 3.13.1
  firebase_analytics: 11.4.6
  cloud_firestore: 5.6.8
  firebase_auth: 5.5.4
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1
  geolocator: ^9.0.2
  lottie: ^3.1.3
  provider: ^6.1.5+1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  connectivity_plus: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/success.lottie
    - assets/zanfusearchscreenlogo.png
    - assets/zanfuwhitelogo.png
    - assets/zanfu_logo.png
    - assets/icon_square.png
    - assets/logo_corners.png
    - assets/google_g_logo.png
    - assets/visidine_logo.png
    - assets/ar_hand_phone.png
    - assets/app_icon.png
